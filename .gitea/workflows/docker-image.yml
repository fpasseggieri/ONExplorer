name: docker-image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_REPOSITORY: ${{ secrets.REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail

          image="onexplorer"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            : "${REGISTRY_HOST:?Missing REGISTRY_HOST secret}"
            : "${REGISTRY_REPOSITORY:?Missing REGISTRY_REPOSITORY secret}"
            image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}"
          fi

          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Derive metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=staging,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
